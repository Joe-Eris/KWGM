  <script>
    /* 1. REAL-TIME COMMA SEPARATOR LOGIC ENGINE */
    const amountDisplay = document.getElementById('amountDisplay');
    const amountRaw = document.getElementById('amountRaw');

    amountDisplay.addEventListener('input', (e) => {
      let value = e.target.value.replace(/,/g, '');
      value = value.replace(/\D/g, '');
      
      if (parseInt(value) > 10000000) {
        value = "10000000";
      }

      if (value) {
        amountRaw.value = value;
        amountDisplay.value = Number(value).toLocaleString('en-US');
      } else {
        amountRaw.value = '';
        amountDisplay.value = '';
      }
    });

    /* 2. INTERACTIVE GENDER CHANNELS MODAL POP-UP SYSTEM */
    const genderTrigger = document.getElementById('genderTrigger');
    const genderModal = document.getElementById('genderModal');
    const genderOutput = document.getElementById('genderOutput');
    const genderRaw = document.getElementById('genderRaw');
    const choiceButtons = document.querySelectorAll('.gender-choice-btn');

    genderTrigger.addEventListener('click', () => {
      genderModal.classList.add('is-visible');
    });

    choiceButtons.forEach(button => {
      button.addEventListener('click', () => {
        const selectedValue = button.getAttribute('data-value');
        genderRaw.value = selectedValue;
        genderOutput.textContent = selectedValue;
        genderOutput.style.color = "white";
        genderModal.classList.remove('is-visible');
      });
    });

    genderModal.addEventListener('click', (e) => {
      if (e.target === genderModal) {
        genderModal.classList.remove('is-visible');
      }
    });

    /* Mobile Drawer Script */
    const menuTrigger = document.getElementById('menuTrigger');
    const navDrawer = document.getElementById('navDrawer');
    const navBackdrop = document.getElementById('navBackdrop');

    if (menuTrigger && navDrawer && navBackdrop) {
      function toggleMenu() {
        const isActive = menuTrigger.classList.toggle('is-active');
        navDrawer.classList.toggle('is-active', isActive);
        navBackdrop.classList.toggle('is-active', isActive);
        document.body.style.overflow = isActive ? 'hidden' : '';
      }

      function closeMenu() {
        menuTrigger.classList.remove('is-active');
        navDrawer.classList.remove('is-active');
        navBackdrop.classList.remove('is-active');
        document.body.style.overflow = '';
      }

      menuTrigger.addEventListener('click', toggleMenu);
      navBackdrop.addEventListener('click', closeMenu);

      document.querySelectorAll('.overlay-links a').forEach(link => {
        link.addEventListener('click', closeMenu);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu();
      });
    }
  </script>

</body>
</html>
